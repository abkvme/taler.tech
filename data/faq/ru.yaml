sections:
  - title: "О проекте"
    icon: "fa-info-circle"
    items:
      - q: "Что такое TALER Blockchain?"
        a: |
          TALER (тикер **TLR**) — гибридная Proof-of-Work / Proof-of-Stake криптовалюта, запущенная в 2017 году. Кодовая база — форк Bitcoin Core, алгоритм майнинга — **Lyra2Z**, PoS активирован на блоке 130 000 в феврале 2019 года. В сообществе известна как «первая белорусская криптовалюта».
      - q: "Когда был запущен TALER Blockchain?"
        a: |
          Первая транзакция прошла **13 сентября 2017 года**, публичный анонс — **6 октября 2017 года**. Цепь изначально была создана на сервисе walletbuilders.com (создание клона Litecoin за пять минут без единой строчки кода) и стартовала на алгоритме **scrypt**, позже форкнувшись на Lyra2Z.
      - q: "Кто создал TALER Blockchain?"
        a: |
          Двое: **Денис Лавникевич** (экономический обозреватель) и **Лавриненко** (IT-менеджер). На genesis-блоке они выделили себе **10% премайна** — 2 333 333 TLR. К февралю 2018 года оба публично объявили об уходе из проекта; что произошло на самом деле, скандалы вокруг премайна и последовавший раскол подробно описаны на [странице истории](/ru/docs/history/).
      - q: "Есть ли сегодня единая «официальная» команда TALER Blockchain?"
        a: |
          Нет. К началу 2020-х все три исходные фракции 2018 года (лагерь Лавникевича, команда Вейшнории и TalerOnline) фактически разошлись. Сеть с тех пор тянут **независимые разработчики** и сообщество — майнеры, стейкеры, операторы бирж, владельцы нод. Ни компании, ни фонда, ни остатков премайна для дележа.
      - q: "Что такое «Вейшнория» и при чём она здесь?"
        a: |
          Вейшнория — вымышленная страна, придуманная в июле 2017 года для российско-белорусских учений «Запад-2017». Белорусский интернет подхватил её как гражданский мем — идеализированную Беларусь с флагом, гимном, e-паспортами и собственной «национальной валютой» **TALER**. Отсюда привязка названия. В августе 2022 года белорусский суд признал материалы и аккаунты Вейшнории *«экстремистскими»*.

  - title: "Технология"
    icon: "fa-microchip"
    items:
      - q: "Какой алгоритм у TALER Blockchain?"
        a: |
          - **Блоки 0–9 999:** scrypt (исходный алгоритм запуска)
          - **Блоки 10 000+:** **Lyra2Z** — memory-hard PoW-алгоритм, устойчивый к ASIC

          Хардфорк на Lyra2Z произошёл на блоке 10 000 **24 ноября 2017 года**, после того как китайские ASIC-операторы захватили большую часть scrypt-хешрейта.
      - q: "TALER — это PoW, PoS или и то и другое?"
        a: |
          И то и другое. PoW работает с genesis; PoS активирован на **блоке 130 000, 10 февраля 2019 года**. PoW- и PoS-блоки сосуществуют в одной цепи, у каждого свой таргет сложности и интервал блоков (60 секунд для PoW, 140 секунд для PoS).
      - q: "Какова максимальная эмиссия?"
        a: |
          **23 333 333 TLR**, минимальная единица — 0,00000001 TLR. Genesis-премайн — **2 333 283 TLR** (~10%). На март 2026 года в обращении ~19,5 млн TLR.
      - q: "Как делится награда за блок?"
        a: |
          С момента активации PoS (блок 130 000) награда распределяется как **70% майнеру / 30% стейкингу**. PoS-награда считается формулой `PoS_reward = PoW_reward × 30 / 70`.
      - q: "Когда происходят халвинги?"
        a: |
          Каждые **1 050 000 PoW-блоков** (~2,5 года). Прошло четыре халвинга. Текущие награды (на март 2026):

          - **PoW:** 0,4375 TLR за блок
          - **PoS:** 0,1875 TLR за блок

          Пятый халвинг ожидается около **декабря 2027 года**.
      - q: "Ключевые форки сети?"
        a: |
          | Высота | Дата | Изменение |
          |---|---|---|
          | 0 | 13.09.2017 | Genesis (scrypt PoW) |
          | 10 000 | 24.11.2017 | Lyra2Z + Dark Gravity Wave v1 |
          | 32 256 | — | BIP65/66/CSV/SegWit |
          | 130 000 | 10.02.2019 | Активация PoS, разделение награды PoW |
          | 250 000 | — | DGW v2 (окно 120 блоков) |
      - q: "Какие форматы адресов поддерживает TALER Blockchain?"
        a: |
          - **P2PKH (Base58):** адреса начинаются с **T**
          - **P2SH (Base58):** префиксный байт 50
          - **Bech32 (SegWit):** HRP — **tlr** (например, `tlr1q...`)
          - **Расширенные публичные ключи:** стандартный BIP32 HD-вывод
      - q: "Какой стандартный P2P-порт?"
        a: |
          **23153**. Версия протокола — 70020.

  - title: "Кошельки, ветки и загрузка"
    icon: "fa-wallet"
    items:
      - q: "Откуда скачать кошелёк?"
        a: |
          С активно разрабатываемой ветки на GitHub: **[github.com/abkvme/taler/releases](https://github.com/abkvme/taler/releases)**. Сборки доступны для Windows, macOS (Apple Silicon), Linux x86_64 и Linux ARM64.
      - q: "Чем отличаются ветки 0.17 и 0.19?"
        a: |
          Обе ветки работают на одной цепи — один протокол, одна сеть, полная совместимость на уровне нод.

          - **0.17 ([cryptadev/taler](https://github.com/cryptadev/taler))** — долгоживущая maintenance-ветка. С 2020 по 2026 год именно она в одиночку тянула проект. Последний релиз — 0.17.2.7 (март 2026). Параллельно поддерживается до сих пор.
          - **0.19 ([abkvme/taler](https://github.com/abkvme/taler))** — современная активная ветка, начатая в 2025 году. Нативные сборки под Apple Silicon и Linux ARM64, модернизированная база кошелька, мультиархитектурные Docker-образы, полноценный CI/CD, UI стейкинга, иконки под тёмные темы, 33 языка интерфейса.

          Кошелёк 0.19 **несовместим с 0.17 в обратную сторону** — после миграции `wallet.dat` обратной дороги нет. Сам блокчейн при этом не меняется, ноды двух веток спокойно общаются между собой.
      - q: "Какую ветку выбрать — 0.17 или 0.19?"
        a: |
          Новым пользователям — **0.19**. Нативная поддержка Apple Silicon, современные сборки, активная разработка. На 0.17 имеет смысл оставаться, только если есть конкретная причина (например, существующий 0.17 кошелёк, который не хочется мигрировать). **Перед апгрейдом на 0.19 обязательно сделайте резервную копию `wallet.dat`** — модернизация базы данных кошелька необратима.
      - q: "Есть ли мобильный (Android) кошелёк?"
        a: |
          Нет. Android-кошелёк был *почти готов* в 2019 году и в итоге был заброшен. Официального мобильного кошелька на данный момент нет.
      - q: "Где хранится `wallet.dat`?"
        a: |
          | ОС | Путь |
          |---|---|
          | Windows | `%APPDATA%\TALER\wallet.dat` |
          | macOS | `~/Taler/wallet.dat` |
          | Linux | `~/.taler/wallet.dat` |
      - q: "Шифруется ли кошелёк по умолчанию?"
        a: |
          **Нет.** Новый кошелёк хранит приватные ключи в открытом виде, пока вы явно его не зашифруете. Зашифровать можно через Settings → Encrypt Wallet (или `taler-cli encryptwallet "passphrase"`). Используется AES-256-CBC с ключом, выведенным через SHA-512. Настоятельно рекомендуется парольная фраза от 20 символов.
      - q: "Как сделать резервную копию кошелька?"
        a: |
          Закройте `taler-qt`, затем скопируйте файл `wallet.dat` в безопасное место (зашифрованный внешний диск, контейнер VeraCrypt и т. п.). Перед тем как полагаться на бэкап — проверьте его восстановление на отдельной системе. **Никакого «забыли пароль»**: потеряв и файл, и парольную фразу, вы теряете монеты навсегда.
      - q: "Что будет, если я потеряю парольную фразу или `wallet.dat`?"
        a: |
          Монеты потеряны **безвозвратно**. Ни компания, ни разработчики, ни кто бы то ни было не сможет их восстановить. Ровно тот же компромисс, что и у Bitcoin: ключи у вас — и ответственность тоже у вас.

  - title: "Майнинг и стейкинг"
    icon: "fa-server"
    items:
      - q: "Можно ли майнить TALER Blockchain?"
        a: |
          Да. PoW работает на Lyra2Z — memory-hard и исторически дружелюбен к GPU/CPU. Существует несколько пулов сообщества; актуальный список сидов и пулов смотрите на [taler.tech](https://taler.tech/) и на [странице нод в кошельке](/ru/docs/node-mining/).
      - q: "Через сколько блоков намайненные монеты можно потратить?"
        a: |
          Через **20 блоков** (coinbase maturity).
      - q: "Как работает стейкинг?"
        a: |
          Вес стейкинга считается по формуле:

          ```
          weight = min(возраст_в_днях, 99) × min(сумма_в_TLR, 9999)
          ```

          На практике:

          - Монеты должны пролежать неподвижно минимум **2 дня**, чтобы начать стейкаться
          - Возраст перестаёт давать прирост после **90 дней** (жёсткий потолок — 99 дней)
          - Один UTXO даёт по сумме не больше **9 999 TLR** в вес — большие балансы выгоднее разделять на несколько выходов
      - q: "Как запустить стейкинг?"
        a: |
          В кошельке 0.19 на странице **Overview** есть встроенное управление стейкингом: выбираете длительность, нажимаете старт — кошелёк держится разблокированным выбранное время с обратным отсчётом и автоматической блокировкой по таймеру. Кошелёк должен быть запущен, онлайн и разблокирован.
      - q: "Есть ли ASIC под TALER Blockchain?"
        a: |
          На исходной scrypt-фазе — да, китайские ASIC-операторы доминировали. После форка 2017 года на Lyra2Z цепь на практике остаётся ASIC-резистентной.

  - title: "Сеть и инфраструктура"
    icon: "fa-network-wired"
    items:
      - q: "Где посмотреть состояние сети?"
        a: |
          - **Обозреватель блоков:** [explorer.taler.tech](https://explorer.taler.tech/) — основной, активно поддерживаемый (запущен в марте 2026)
          - **Другие обозреватели (старые, но рабочие):** [explorer.talercoin.org](https://explorer.talercoin.org/), [explorer.talercrypto.com](https://explorer.talercrypto.com/)
          - **Страница Nodes в кошельке:** в 0.19 встроена проверка сидов / пиров / связности
      - q: "Где торгуется TLR?"
        a: |
          Активные пары на момент написания:

          - **Qutrade** — [TLR/USDT](https://qutrade.io/en/?market=tlr_usdt) (самый свежий листинг)
          - [BTC-Trade](https://btc-trade.com.ua/)
          - [Richamster](https://richamster.com/trade/TLR_BTC/) — TLR/BTC
          - [Bololex](https://bololex.com/trading/sessions/market-view?symbol=TLR-USDT) — TLR/USDT
          - [OCCE](https://www.occe.io/exchange/tlr_btc) — TLR/BTC

          Также есть низковолюмные площадки вроде Crex24 и STEX. Перед использованием конкретной пары всегда проверяйте текущий объём.
      - q: "Где сообщество?"
        a: |
          Активный Telegram-чат — **[t.me/talercommunity](https://t.me/talercommunity)**. Новостные и исторические каналы тоже живы (см. [Ссылки](/ru/links/)).
      - q: "Есть ли дорожная карта?"
        a: |
          Активная разработка идёт в **ветке 0.19**. Последние релизы: нативные сборки под Apple Silicon и Linux ARM64, модернизация базы кошелька, мультиархитектурные Docker-образы, страница Nodes в приложении, UI стейкинга, переезд macOS-сборок на полностью самодостаточные бинарники без Homebrew. Направление развития определяют разработчики, реально пишущие код, а не маркетинговый roadmap. Следить — на [github.com/abkvme/taler/releases](https://github.com/abkvme/taler/releases).

  - title: "Частые опасения"
    icon: "fa-shield-alt"
    items:
      - q: "А премайн действительно был?"
        a: |
          Да — **2 333 283 TLR** (~10% от максимальной эмиссии) были вмайнены в genesis-блок в 2017 году исходными основателями. Публично они обещали раздать их бизнесу бесплатно; на практике никто из участников сообщества так и не подтвердил, что получил эти монеты. Многолетние споры, частичные переводы, «заблокированный» кошелёк с забытым паролем и 320 000 TLR, ушедшие на неизвестный адрес, — всё это разобрано на [странице истории](/ru/docs/history/).
      - q: "TALER — это скам?"
        a: |
          Управление премайном со стороны основателей 2017–2018 годов было, мягко говоря, спорным, а первые годы проекта — это сплошные публичные склоки трёх фракций. Тот TALER давно закончился. Сегодняшняя цепь — это open-source проект сообщества: без центральной команды, без оставшегося премайна и с разработчиками, которые публично шипят код на GitHub. Относитесь к нему ровно так: маленькая, давно живущая криптовалюта, которую можно полностью аудировать самостоятельно, а не управляемый бизнес.
      - q: "TALER легален в Беларуси?"
        a: |
          Криптовалюты в Беларуси регулируются **Декретом № 8** (подписан в декабре 2017, вступил в силу 28 марта 2018) и последующими актами. У TALER нет какого-то особого правового статуса. Мем «Вейшнория», исторически связанный с TALER Blockchain, был признан *«экстремистским»* белорусским судом в августе 2022 года, но это решение касается аккаунтов и материалов Вейшнории, а не блокчейна TALER Blockchain. По вашей юрисдикции — консультируйтесь с местным юристом.
      - q: "Почему TALER всё ещё существует?"
        a: |
          Потому что цепь по-прежнему производит блоки, кошелёк по-прежнему обновляется, биржи по-прежнему листят TLR, а сообщество по-прежнему здесь. За восемь лет, три враждующие фракции, премайн-драму, заброшенный мобильный кошелёк и график цены, большую часть жизни смотрящий в одну сторону, TALER пришёл к тихой стабильности: маленький open-source блокчейн на поддержке сообщества — и одна из самых колоритных историй в постсоветской криптоистории.
