sections:
  - title: "Про проєкт"
    icon: "fa-info-circle"
    items:
      - q: "Що таке TALER?"
        a: |
          TALER (тикер **TLR**) — гібридна Proof-of-Work / Proof-of-Stake криптовалюта, запущена у 2017 році. Кодова база — форк Bitcoin Core, алгоритм майнінгу — **Lyra2Z**, PoS активований на блоці 130 000 у лютому 2019 року. У спільноті відома як «перша білоруська криптовалюта».
      - q: "Коли було запущено TALER?"
        a: |
          Перша транзакція відбулась **13 вересня 2017 року**, публічний анонс — **6 жовтня 2017 року**. Мережа була створена на сервісі walletbuilders.com (клон Litecoin за п'ять хвилин без жодного рядка коду) і стартувала на алгоритмі **scrypt**, пізніше зробила хардфорк на Lyra2Z.
      - q: "Хто створив TALER?"
        a: |
          Двоє: **Денис Лавнікевич** (економічний оглядач) та **Лавриненко** (IT-менеджер). На genesis-блоці вони виділили собі **10% премайну** — 2 333 333 TLR. До лютого 2018 року обидва публічно оголосили про вихід з проєкту; що сталося насправді, скандали навколо премайну і подальший розкол детально описані на [сторінці історії](/uk/docs/history/).
      - q: "Чи існує сьогодні єдина «офіційна» команда TALER?"
        a: |
          Ні. На початок 2020-х усі три початкові фракції 2018 року (табір Лавнікевича, команда Вейшнорії і TalerOnline) фактично розійшлися. Мережу з тих часів тягнуть **незалежні розробники** і спільнота — майнери, стейкери, оператори бірж, власники нод. Ні компанії, ні фонду, ні залишків премайну для розподілу.
      - q: "Що таке «Вейшнорія» і чому вона тут постійно?"
        a: |
          Вейшнорія — вигадана країна, придумана в липні 2017 року для російсько-білоруських навчань «Захід-2017». Білоруський інтернет підхопив її як громадянський мем — ідеалізовану Білорусь з прапором, гімном, e-паспортами і власною «національною валютою» **TALER**. Звідси прив'язка назви. У серпні 2022 року білоруський суд визнав матеріали і акаунти Вейшнорії *«екстремістськими»*.

  - title: "Технологія"
    icon: "fa-microchip"
    items:
      - q: "Який алгоритм у TALER?"
        a: |
          - **Блоки 0–9 999:** scrypt (початковий алгоритм запуску)
          - **Блоки 10 000+:** **Lyra2Z** — memory-hard PoW-алгоритм, стійкий до ASIC

          Хардфорк на Lyra2Z відбувся на блоці 10 000 **24 листопада 2017 року**, після того як китайські ASIC-оператори захопили більшу частину scrypt-хешрейту.
      - q: "TALER — це PoW, PoS чи і те, і інше?"
        a: |
          І те, і інше. PoW працює з genesis; PoS активований на **блоці 130 000, 10 лютого 2019 року**. PoW- і PoS-блоки співіснують в одному ланцюзі, у кожного свій таргет складності та інтервал блоків (60 секунд для PoW, 140 секунд для PoS).
      - q: "Яка максимальна емісія?"
        a: |
          **23 333 333 TLR**, мінімальна одиниця — 0,00000001 TLR. Genesis-премайн — **2 333 283 TLR** (~10%). Станом на березень 2026 року в обігу ~19,5 млн TLR.
      - q: "Як ділиться винагорода за блок?"
        a: |
          З моменту активації PoS (блок 130 000) винагорода розподіляється як **70% майнеру / 30% стейкінгу**. PoS-винагорода рахується за формулою `PoS_reward = PoW_reward × 30 / 70`.
      - q: "Коли відбуваються халвінги?"
        a: |
          Кожні **1 050 000 PoW-блоків** (~2,5 року). Пройшло чотири халвінги. Поточні винагороди (на березень 2026):

          - **PoW:** 0,4375 TLR за блок
          - **PoS:** 0,1875 TLR за блок

          П'ятий халвінг очікується близько **грудня 2027 року**.
      - q: "Ключові форки мережі?"
        a: |
          | Висота | Дата | Зміна |
          |---|---|---|
          | 0 | 13.09.2017 | Genesis (scrypt PoW) |
          | 10 000 | 24.11.2017 | Lyra2Z + Dark Gravity Wave v1 |
          | 32 256 | — | BIP65/66/CSV/SegWit |
          | 130 000 | 10.02.2019 | Активація PoS, розподіл винагороди PoW |
          | 250 000 | — | DGW v2 (вікно 120 блоків) |
      - q: "Які формати адрес підтримує TALER?"
        a: |
          - **P2PKH (Base58):** адреси починаються з **T**
          - **P2SH (Base58):** префіксний байт 50
          - **Bech32 (SegWit):** HRP — **tlr** (наприклад, `tlr1q...`)
          - **Розширені публічні ключі:** стандартний BIP32 HD
      - q: "Який стандартний P2P-порт?"
        a: |
          **23153**. Версія протоколу — 70020.

  - title: "Гаманці, гілки та завантаження"
    icon: "fa-wallet"
    items:
      - q: "Звідки завантажити гаманець?"
        a: |
          З гілки, що активно розробляється, на GitHub: **[github.com/abkvme/taler/releases](https://github.com/abkvme/taler/releases)**. Збірки для Windows, macOS (Apple Silicon), Linux x86_64 і Linux ARM64.
      - q: "Чим відрізняються гілки 0.17 і 0.19?"
        a: |
          Обидві гілки працюють на одному ланцюзі — той самий протокол, та сама мережа, повна сумісність на рівні нод.

          - **0.17 ([cryptadev/taler](https://github.com/cryptadev/taler))** — довга maintenance-гілка. З 2020 по 2026 рік саме вона наодинці тягнула проєкт. Останній реліз — 0.17.2.7 (березень 2026). Підтримується паралельно і досі.
          - **0.19 ([abkvme/taler](https://github.com/abkvme/taler))** — сучасна активна гілка, розпочата у 2025 році. Нативні збірки під Apple Silicon і Linux ARM64, модернізована база гаманця, мультиархітектурні Docker-образи, повноцінний CI/CD, UI стейкінгу, іконки під темні теми, 33 мови інтерфейсу.

          Гаманець 0.19 **несумісний з 0.17 у зворотному напрямку** — після міграції `wallet.dat` назад дороги немає. Сам блокчейн при цьому не змінюється, ноди двох гілок спокійно спілкуються між собою.
      - q: "Яку гілку обрати — 0.17 чи 0.19?"
        a: |
          Новим користувачам — **0.19**. Нативна підтримка Apple Silicon, сучасні збірки, активна розробка. Залишатись на 0.17 має сенс лише якщо є конкретна причина (наприклад, наявний 0.17 гаманець, який не хочеться мігрувати). **Перед апгрейдом на 0.19 обов'язково зробіть резервну копію `wallet.dat`** — модернізація бази даних гаманця незворотна.
      - q: "Чи є мобільний (Android) гаманець?"
        a: |
          Ні. Android-гаманець був *майже готовий* у 2019 році і врешті був покинутий. Офіційного мобільного гаманця наразі немає.
      - q: "Де зберігається `wallet.dat`?"
        a: |
          | ОС | Шлях |
          |---|---|
          | Windows | `%APPDATA%\TALER\wallet.dat` |
          | macOS | `~/Taler/wallet.dat` |
          | Linux | `~/.taler/wallet.dat` |
      - q: "Чи шифрується гаманець за замовчуванням?"
        a: |
          **Ні.** Новий гаманець зберігає приватні ключі у відкритому вигляді, поки ви явно його не зашифруєте. Зашифрувати можна через Settings → Encrypt Wallet (або `taler-cli encryptwallet "passphrase"`). Використовується AES-256-CBC з ключем, виведеним через SHA-512. Наполегливо рекомендується парольна фраза від 20 символів.
      - q: "Як зробити резервну копію гаманця?"
        a: |
          Закрийте `taler-qt`, потім скопіюйте файл `wallet.dat` у безпечне місце (зашифрований зовнішній диск, контейнер VeraCrypt тощо). Перш ніж покладатись на бекап — перевірте його відновлення на окремій системі. **Жодного «забув пароль»**: втративши і файл, і парольну фразу, ви втрачаєте монети назавжди.
      - q: "Що буде, якщо я втрачу парольну фразу або `wallet.dat`?"
        a: |
          Монети втрачено **безповоротно**. Ні компанія, ні розробники, ні будь-хто інший не зможе їх відновити. Точно той самий компроміс, що і в Bitcoin: ключі ваші — і відповідальність також ваша.

  - title: "Майнінг та стейкінг"
    icon: "fa-server"
    items:
      - q: "Чи можна майнити TALER?"
        a: |
          Так. PoW працює на Lyra2Z — memory-hard і історично дружній до GPU/CPU. Існує кілька пулів спільноти; актуальний список сидів і пулів дивіться на [taler.tech](https://taler.tech/) та на [сторінці нод у гаманці](/uk/docs/node-mining/).
      - q: "Через скільки блоків намайнені монети можна витратити?"
        a: |
          Через **20 блоків** (coinbase maturity).
      - q: "Як працює стейкінг?"
        a: |
          Вага стейкінгу рахується за формулою:

          ```
          weight = min(вік_у_днях, 99) × min(сума_у_TLR, 9999)
          ```

          На практиці:

          - Монети мають полежати нерухомо мінімум **2 дні**, щоб почати стейкатись
          - Вік перестає додавати після **90 днів** (жорстка стеля — 99 днів)
          - Один UTXO дає по сумі не більше **9 999 TLR** у вагу — великі баланси вигідніше ділити на кілька виходів
      - q: "Як запустити стейкінг?"
        a: |
          У гаманці 0.19 на сторінці **Overview** є вбудоване керування стейкінгом: обираєте тривалість, натискаєте старт — гаманець тримається розблокованим обраний час із зворотним відліком і автоматичним блокуванням за таймером. Гаманець має бути запущеним, онлайн і розблокованим.
      - q: "Чи є ASIC під TALER?"
        a: |
          На початковій scrypt-фазі — так, китайські ASIC-оператори домінували. Після форку 2017 року на Lyra2Z мережа на практиці залишається ASIC-резистентною.

  - title: "Мережа та інфраструктура"
    icon: "fa-network-wired"
    items:
      - q: "Де подивитись стан мережі?"
        a: |
          - **Оглядач блоків:** [explorer.taler.tech](https://explorer.taler.tech/) — основний, активно підтримуваний (запущений у березні 2026)
          - **Інші оглядачі (старіші, але робочі):** [explorer.talercoin.org](https://explorer.talercoin.org/), [explorer.talercrypto.com](https://explorer.talercrypto.com/)
          - **Сторінка Nodes у гаманці:** у 0.19 вбудована перевірка сидів / пірів / зв'язності
      - q: "Де торгується TLR?"
        a: |
          Активні пари на момент написання:

          - **Qutrade** — [TLR/USDT](https://qutrade.io/en/?market=tlr_usdt) (найсвіжіший лістинг)
          - [BTC-Trade](https://btc-trade.com.ua/)
          - [Richamster](https://richamster.com/trade/TLR_BTC/) — TLR/BTC
          - [Bololex](https://bololex.com/trading/sessions/market-view?symbol=TLR-USDT) — TLR/USDT
          - [OCCE](https://www.occe.io/exchange/tlr_btc) — TLR/BTC

          Також є низьковолюмні майданчики на кшталт Crex24 і STEX. Перед використанням конкретної пари завжди перевіряйте поточний обсяг.
      - q: "Де спільнота?"
        a: |
          Активний Telegram-чат — **[t.me/talercommunity](https://t.me/talercommunity)**. Новинні та історичні канали також живі (див. [Посилання](/uk/links/)).
      - q: "Чи є дорожня карта?"
        a: |
          Активна розробка йде у **гілці 0.19**. Останні релізи: нативні збірки під Apple Silicon і Linux ARM64, модернізація бази гаманця, мультиархітектурні Docker-образи, сторінка Nodes у застосунку, UI стейкінгу, переїзд macOS-збірок на повністю самодостатні бінарні файли без Homebrew. Напрям розвитку визначають розробники, які реально пишуть код, а не маркетинговий roadmap. Слідкувати — на [github.com/abkvme/taler/releases](https://github.com/abkvme/taler/releases).

  - title: "Поширені занепокоєння"
    icon: "fa-shield-alt"
    items:
      - q: "А премайн справді був?"
        a: |
          Так — **2 333 283 TLR** (~10% від максимальної емісії) було вмайнено у genesis-блок у 2017 році початковими засновниками. Публічно обіцялося роздати їх бізнесу безкоштовно; на практиці ніхто з учасників спільноти так і не підтвердив, що отримав ці монети. Багаторічні суперечки, часткові перекази, «заблокований» гаманець із забутим паролем і 320 000 TLR, що пішли на невідому адресу, — усе це розглянуто на [сторінці історії](/uk/docs/history/).
      - q: "TALER — це скам?"
        a: |
          Управління премайном з боку засновників 2017–2018 років було, м'яко кажучи, спірним, а перші роки проєкту — це суцільні публічні чвари трьох фракцій. Той TALER давно скінчився. Сьогоднішня мережа — це open-source проєкт спільноти: без центральної команди, без залишків премайну і з розробниками, які публічно шиплять код на GitHub. Ставтесь до нього саме так: маленька, довгоживуча криптовалюта, яку можна повністю аудитувати самостійно, а не керований бізнес.
      - q: "TALER легальний у Білорусі?"
        a: |
          Криптовалюти у Білорусі регулюються **Декретом №8** (підписаний у грудні 2017, набрав чинності 28 березня 2018) та подальшими актами. У TALER немає якогось особливого правового статусу. Мем «Вейшнорія», історично пов'язаний із TALER, був визнаний *«екстремістським»* білоруським судом у серпні 2022 року, але це рішення стосується акаунтів і матеріалів Вейшнорії, а не блокчейну TALER. Щодо вашої юрисдикції — консультуйтесь із місцевим юристом.
      - q: "Чому TALER усе ще існує?"
        a: |
          Тому що мережа все ще виробляє блоки, гаманець все ще оновлюється, біржі все ще лістять TLR, а спільнота все ще тут. За вісім років, три ворогуючі фракції, премайн-драму, покинутий мобільний гаманець і графік ціни, який більшу частину життя дивиться в один бік, TALER прийшов до тихої стабільності: маленький open-source блокчейн на підтримці спільноти — і одна з найколоритніших історій у пострадянській криптоісторії.
