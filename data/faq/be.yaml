sections:
  - title: "Пра праект"
    icon: "fa-info-circle"
    items:
      - q: "Што такое TALER?"
        a: |
          TALER (тыкер **TLR**) — гібрыдная Proof-of-Work / Proof-of-Stake крыптавалюта, запушчаная ў 2017 годзе. Кодавая база — форк Bitcoin Core, алгарытм майнінгу — **Lyra2Z**, PoS актываваны на блоку 130 000 у лютым 2019 года. У супольнасці вядомая як «першая беларуская крыптавалюта».
      - q: "Калі быў запушчаны TALER?"
        a: |
          Першая транзакцыя адбылася **13 верасня 2017 года**, публічны анонс — **6 кастрычніка 2017 года**. Сетка была створана ў канструктары на walletbuilders.com (клон Litecoin за пяць хвілін без адзінага радка кода) і стартавала на алгарытме **scrypt**, пазней зрабіла хардфорк на Lyra2Z.
      - q: "Хто стварыў TALER?"
        a: |
          Двое: **Дзяніс Лаўнікевіч** (эканамічны аглядальнік) і **Лаўрыненка** (IT-менеджар). На genesis-блоку яны вылучылі сабе **10% прэмайна** — 2 333 333 TLR. Да лютага 2018 года абодва публічна абвясцілі пра сыход з праекта; што адбылося насамрэч, скандалы вакол прэмайна і наступны раскол падрабязна апісаны на [старонцы гісторыі](/be/docs/history/).
      - q: "Ці існуе сёння адзіная «афіцыйная» каманда TALER?"
        a: |
          Не. Да пачатку 2020-х усе тры зыходныя фракцыі 2018 года (лагер Лаўнікевіча, каманда Вейшнорыі і TalerOnline) фактычна разышліся. Сетку з тых часоў цягнуць **незалежныя распрацоўшчыкі** і супольнасць — майнеры, стэйкеры, аператары біржаў, людзі з нодамі. Ні кампаніі, ні фонда, ні рэшткаў прэмайна для дзяльбы.
      - q: "Што такое «Вейшнорыя» і чаму яна тут увесь час?"
        a: |
          Вейшнорыя — выдуманая краіна, прыдуманая ў ліпені 2017 года для расійска-беларускіх вучэнняў «Захад-2017». Беларускі інтэрнэт падхапіў гэта як грамадзянскі мем — ідэалізаваную Беларусь з сцягам, гімнам, e-пашпартамі і ўласнай «нацыянальнай валютай» **TALER**. Адсюль і прывязка назвы. У жніўні 2022 года беларускі суд прызнаў матэрыялы і акаунты Вейшнорыі *«экстрэмісцкімі»*.

  - title: "Тэхналогія"
    icon: "fa-microchip"
    items:
      - q: "Які алгарытм у TALER?"
        a: |
          - **Блокі 0–9 999:** scrypt (зыходны алгарытм запуску)
          - **Блокі 10 000+:** **Lyra2Z** — memory-hard PoW-алгарытм, устойлівы да ASIC

          Хардфорк на Lyra2Z адбыўся на блоку 10 000 **24 лістапада 2017 года** — пасля таго як кітайскія ASIC-аператары захапілі большую частку scrypt-хэшрэйта.
      - q: "TALER — гэта PoW, PoS ці і тое, і другое?"
        a: |
          І тое, і другое. PoW працуе з genesis; PoS актываваны на **блоку 130 000, 10 лютага 2019 года**. PoW- і PoS-блокі суіснуюць у адной сетцы, у кожнага свой таргет складанасці і інтэрвал блокаў (60 секунд для PoW, 140 секунд для PoS).
      - q: "Якая максімальная эмісія?"
        a: |
          **23 333 333 TLR**, мінімальная адзінка — 0,00000001 TLR. Genesis-прэмайн — **2 333 283 TLR** (~10%). На сакавік 2026 года ў абарачэнні ~19,5 млн TLR.
      - q: "Як дзеліцца ўзнагарода за блок?"
        a: |
          З моманту актывацыі PoS (блок 130 000) узнагарода размяркоўваецца як **70% майнеру / 30% стэйкінгу**. PoS-узнагарода лічыцца як `PoS_reward = PoW_reward × 30 / 70`.
      - q: "Калі адбываюцца халвінгі?"
        a: |
          Кожныя **1 050 000 PoW-блокаў** (~2,5 года). Прайшло чатыры халвінгі. Бягучыя ўзнагароды (на сакавік 2026):

          - **PoW:** 0,4375 TLR за блок
          - **PoS:** 0,1875 TLR за блок

          Пяты халвінг чакаецца каля **снежня 2027 года**.
      - q: "Ключавыя форкі сеткі?"
        a: |
          | Вышыня | Дата | Змяненне |
          |---|---|---|
          | 0 | 13.09.2017 | Genesis (scrypt PoW) |
          | 10 000 | 24.11.2017 | Lyra2Z + Dark Gravity Wave v1 |
          | 32 256 | — | BIP65/66/CSV/SegWit |
          | 130 000 | 10.02.2019 | Актывацыя PoS, падзел узнагароды PoW |
          | 250 000 | — | DGW v2 (акно 120 блокаў) |
      - q: "Якія фарматы адрасоў падтрымлівае TALER?"
        a: |
          - **P2PKH (Base58):** адрасы пачынаюцца з **T**
          - **P2SH (Base58):** прэфіксны байт 50
          - **Bech32 (SegWit):** HRP — **tlr** (напрыклад, `tlr1q...`)
          - **Пашыраныя публічныя ключы:** стандартны BIP32 HD
      - q: "Які стандартны P2P-порт?"
        a: |
          **23153**. Версія пратакола — 70020.

  - title: "Кашалькі, галіны і загрузка"
    icon: "fa-wallet"
    items:
      - q: "Адкуль спампаваць кашалёк?"
        a: |
          З актыўна падтрымліванай галіны на GitHub: **[github.com/abkvme/taler/releases](https://github.com/abkvme/taler/releases)**. Зборкі для Windows, macOS (Apple Silicon), Linux x86_64 і Linux ARM64.
      - q: "Чым адрозніваюцца галіны 0.17 і 0.19?"
        a: |
          Абедзве галіны працуюць на адной сетцы — той самы пратакол, тая самая сетка, поўная сумяшчальнасць на ўзроўні нод.

          - **0.17 ([cryptadev/taler](https://github.com/cryptadev/taler))** — даўгая maintenance-галіна. З 2020 па 2026 год менавіта яна ў адзіночку цягнула праект. Апошні рэліз — 0.17.2.7 (сакавік 2026). Падтрымліваецца паралельна да гэтага часу.
          - **0.19 ([abkvme/taler](https://github.com/abkvme/taler))** — сучасная актыўная галіна, пачатая ў 2025 годзе. Натыўныя зборкі пад Apple Silicon і Linux ARM64, мадэрнізаваная база кашалька, мульты-архітэктурныя Docker-вобразы, паўнавартасны CI/CD, UI стэйкінга, іконкі пад цёмныя тэмы, 33 мовы інтэрфейсу.

          Кашалёк 0.19 **не сумяшчальны з 0.17 у адваротны бок** — пасля міграцыі `wallet.dat` назад дарогі няма. Сам блакчэйн пры гэтым не змяняецца, ноды дзвюх галін спакойна размаўляюць між сабой.
      - q: "Якую галіну выбраць — 0.17 ці 0.19?"
        a: |
          Новым карыстальнікам — **0.19**. Натыўная падтрымка Apple Silicon, сучасныя зборкі, актыўная распрацоўка. Заставацца на 0.17 мае сэнс толькі калі ёсць канкрэтная прычына (напрыклад, існуючы 0.17 кашалёк, які не хочацца мігрыраваць). **Перад апгрэйдам на 0.19 абавязкова зрабіце рэзервовую копію `wallet.dat`** — мадэрнізацыя базы дадзеных кашалька неабарачальная.
      - q: "Ці ёсць мабільны (Android) кашалёк?"
        a: |
          Не. Android-кашалёк быў *амаль гатовы* у 2019 годзе і ў выніку быў закінуты. Афіцыйнага мабільнага кашалька на дадзены момант няма.
      - q: "Дзе захоўваецца `wallet.dat`?"
        a: |
          | АС | Шлях |
          |---|---|
          | Windows | `%APPDATA%\TALER\wallet.dat` |
          | macOS | `~/Taler/wallet.dat` |
          | Linux | `~/.taler/wallet.dat` |
      - q: "Ці шыфруецца кашалёк па змаўчанні?"
        a: |
          **Не.** Новы кашалёк захоўвае прыватныя ключы ў адкрытым выглядзе, пакуль вы яго відавочна не зашыфруеце. Зашыфраваць можна праз Settings → Encrypt Wallet (або `taler-cli encryptwallet "passphrase"`). Выкарыстоўваецца AES-256-CBC з ключом, выведзеным праз SHA-512. Настойліва рэкамендуецца парольная фраза ад 20 знакаў.
      - q: "Як зрабіць рэзервовую копію кашалька?"
        a: |
          Зачыніце `taler-qt`, затым скапіруйце файл `wallet.dat` у бяспечнае месца (зашыфраваны знешні дыск, кантэйнер VeraCrypt і г. д.). Перад тым як давяраць бэкапу — праверце яго аднаўленне на асобнай сістэме. **Ніякага «забыў пароль»**: страціўшы і файл, і парольную фразу, вы губляеце манеты назаўжды.
      - q: "Што калі я страчу парольную фразу або `wallet.dat`?"
        a: |
          Манеты страчаны **беззваротна**. Ні кампанія, ні распрацоўшчыкі, ні хто-небудзь яшчэ не зможа іх аднавіць. Дакладна тая ж умова, што і ў Bitcoin: ключы вашыя — і адказнасць таксама вашая.

  - title: "Майнінг і стэйкінг"
    icon: "fa-server"
    items:
      - q: "Ці можна майніць TALER?"
        a: |
          Так. PoW працуе на Lyra2Z — memory-hard і гістарычна сяброўскі для GPU/CPU. Ёсць некалькі пулаў супольнасці; актуальны спіс сідаў і пулаў глядзіце на [taler.tech](https://taler.tech/) і на [старонцы нод у кашальку](/be/docs/node-mining/).
      - q: "Праз колькі блокаў намайненыя манеты можна патраціць?"
        a: |
          Праз **20 блокаў** (coinbase maturity).
      - q: "Як працуе стэйкінг?"
        a: |
          Вага стэйкінга лічыцца па формуле:

          ```
          weight = min(узрост_у_днях, 99) × min(сума_ў_TLR, 9999)
          ```

          На практыцы:

          - Манеты павінны паляжаць нерухома мінімум **2 дні**, каб пачаць стэйкацца
          - Узрост перастае дадаваць пасля **90 дзён** (жорсткая столь — 99 дзён)
          - Адзін UTXO дае па суме не больш за **9 999 TLR** у вагу — вялікія балансы выгадней дзяліць на некалькі выхадаў
      - q: "Як запусціць стэйкінг?"
        a: |
          У кашальку 0.19 на старонцы **Overview** ёсць убудаванае кіраванне стэйкінгам: выбіраеце працягласць, націскаеце старт — кашалёк трымаецца разблакаваным выбраны час з адваротным адлікам і аўтаматычнай блакіроўкай па таймеры. Кашалёк павінен быць запушчаны, у анлайне і разблакаваны.
      - q: "Ці ёсць ASIC пад TALER?"
        a: |
          На зыходнай scrypt-фазе — так, кітайскія ASIC-аператары дамінавалі. Пасля форку 2017 года на Lyra2Z сетка на практыцы застаецца ASIC-рэзістэнтнай.

  - title: "Сетка і інфраструктура"
    icon: "fa-network-wired"
    items:
      - q: "Дзе паглядзець стан сеткі?"
        a: |
          - **Аглядальнік блокаў:** [explorer.taler.tech](https://explorer.taler.tech/) — асноўны, актыўна падтрымліваецца (запушчаны ў сакавіку 2026)
          - **Іншыя аглядальнікі (старэйшыя, але працуюць):** [explorer.talercoin.org](https://explorer.talercoin.org/), [explorer.talercrypto.com](https://explorer.talercrypto.com/)
          - **Старонка Nodes у кашальку:** у 0.19 убудавана праверка сідаў / піраў / звязнасці
      - q: "Дзе гандлюецца TLR?"
        a: |
          Актыўныя пары на момант напісання:

          - **Qutrade** — [TLR/USDT](https://qutrade.io/en/?market=tlr_usdt) (самы свежы лістынг)
          - [BTC-Trade](https://btc-trade.com.ua/)
          - [Richamster](https://richamster.com/trade/TLR_BTC/) — TLR/BTC
          - [Bololex](https://bololex.com/trading/sessions/market-view?symbol=TLR-USDT) — TLR/USDT
          - [OCCE](https://www.occe.io/exchange/tlr_btc) — TLR/BTC

          Таксама ёсць нізкавалюмныя пляцоўкі накшталт Crex24 і STEX. Перад выкарыстаннем канкрэтнай пары заўсёды правярайце бягучы аб'ём.
      - q: "Дзе супольнасць?"
        a: |
          Актыўны Telegram-чат — **[t.me/talercommunity](https://t.me/talercommunity)**. Навінавыя і гістарычныя каналы таксама жывыя (гл. [Спасылкі](/be/links/)).
      - q: "Ці ёсць дарожная карта?"
        a: |
          Актыўная распрацоўка ідзе ў **галіне 0.19**. Апошнія рэлізы: натыўныя зборкі пад Apple Silicon і Linux ARM64, мадэрнізацыя базы кашалька, мульты-архітэктурныя Docker-вобразы, старонка Nodes у дадатку, UI стэйкінга, пераезд macOS-зборак на цалкам самадастатковыя бінарныя файлы без Homebrew. Кірунак развіцця вызначаюць распрацоўшчыкі, якія рэальна пішуць код, а не маркетынгавы roadmap. Сачыць — на [github.com/abkvme/taler/releases](https://github.com/abkvme/taler/releases).

  - title: "Частыя занепакоенасці"
    icon: "fa-shield-alt"
    items:
      - q: "А прэмайн сапраўды быў?"
        a: |
          Так — **2 333 283 TLR** (~10% ад максімальнай эмісіі) былі ўмайнены ў genesis-блок у 2017 годзе зыходнымі заснавальнікамі. Публічна абяцалася раздаць іх бізнесу бясплатна; на практыцы ніхто з удзельнікаў супольнасці так і не пацвердзіў, што атрымаў гэтыя манеты. Шматгадовыя спрэчкі, частковыя пераводы, «заблакаваны» кашалёк з забытым паролем і 320 000 TLR, што пайшлі на невядомы адрас, — усё гэта разгледжана на [старонцы гісторыі](/be/docs/history/).
      - q: "TALER — гэта скам?"
        a: |
          Кіраванне прэмайнам з боку заснавальнікаў 2017–2018 гадоў было, мякка кажучы, спрэчным, а першыя гады праекта — гэта суцэльныя публічныя сваркі трох фракцый. Той TALER даўно скончыўся. Сённяшняя сетка — гэта open-source праект супольнасці: без цэнтральнай каманды, без рэшткаў прэмайна і з распрацоўшчыкамі, якія публічна шыпяць код на GitHub. Стаўцеся да яго менавіта так: маленькая, доўгажывучая крыптавалюта, якую можна цалкам аўдыраваць самастойна, а не кіраваны бізнес.
      - q: "TALER легальны ў Беларусі?"
        a: |
          Крыптавалюты ў Беларусі рэгулююцца **Дэкрэтам №8** (падпісаны ў снежні 2017, уступіў у сілу 28 сакавіка 2018) і наступнымі актамі. У TALER няма нейкага асаблівага прававога статусу. Мем «Вейшнорыя», гістарычна звязаны з TALER, быў прызнаны *«экстрэмісцкім»* беларускім судом у жніўні 2022 года, але гэта рашэнне тычыцца акаунтаў і матэрыялаў Вейшнорыі, а не блакчэйна TALER. Па вашай юрысдыкцыі — кансультуйцеся з мясцовым юрыстам.
      - q: "Чаму TALER усё яшчэ існуе?"
        a: |
          Таму што сетка ўсё яшчэ вырабляе блокі, кашалёк усё яшчэ абнаўляецца, біржы ўсё яшчэ лістуюць TLR, а супольнасць усё яшчэ тут. За восем гадоў, тры варагуючыя фракцыі, прэмайн-драму, закінуты мабільны кашалёк і графік цаны, які большую частку жыцця глядзіць у адным кірунку, TALER прыйшоў да ціхай стабільнасці: маленькі open-source блакчэйн на падтрымцы супольнасці — і адна з самых каларытных гісторый у постсавецкай крыптагісторыі.
