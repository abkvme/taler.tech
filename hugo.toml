baseURL = 'https://taler.tech/'
title = 'TALER Blockchain'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true
enableRobotsTXT = true

# Drive page .Lastmod from the most recent git commit that touched the file.
# Required for the "Last updated YYYY-MM-DD" line on docs pages and for the
# `dateModified` field in TechArticle / Article JSON-LD.
enableGitInfo = true

# No tagged or categorised content yet — keep Hugo from emitting empty
# /categories/ and /tags/ index pages that would otherwise be indexed.
disableKinds = ['taxonomy', 'term']

# Related-content index drives the "Related docs" block at the bottom of
# every docs single page. Section is the strongest signal because docs
# don't have tags or categories. Kind/lang ensure we only relate within
# the same content type and language.
[related]
  threshold = 60
  toLower = false
  [[related.indices]]
    name = "section"
    weight = 80
  [[related.indices]]
    name = "title"
    weight = 30
  [[related.indices]]
    name = "kind"
    weight = 20

[languages]
  [languages.en]
    languageName = 'English'
    weight = 1
    title = 'TALER Blockchain'
    [languages.en.params]
      languageCode = 'en'
      ogLocale = 'en_US'
      description = 'TALER Blockchain — a modern hybrid PoW/PoS cryptocurrency inspired by the historic European Thaler. Secure, fast, decentralized. Wallets, nodes and developer docs.'

  [languages.be]
    languageName = 'Беларуская'
    weight = 2
    title = 'Блакчэйн TALER'
    [languages.be.params]
      languageCode = 'be'
      ogLocale = 'be_BY'
      description = 'Блакчэйн TALER — сучасная гібрыдная PoW/PoS крыптавалюта, натхнёная гістарычным еўрапейскім Талерам. Бяспечны, хуткі, дэцэнтралізаваны.'

  [languages.ru]
    languageName = 'Русский'
    weight = 3
    title = 'Блокчейн TALER'
    [languages.ru.params]
      languageCode = 'ru'
      ogLocale = 'ru_RU'
      description = 'Блокчейн TALER — современная гибридная PoW/PoS криптовалюта, вдохновлённая историческим европейским Талером. Безопасный, быстрый, децентрализованный.'

  [languages.uk]
    languageName = 'Українська'
    weight = 4
    title = 'Блокчейн TALER'
    [languages.uk.params]
      languageCode = 'uk'
      ogLocale = 'uk_UA'
      description = 'Блокчейн TALER — сучасна гібридна PoW/PoS криптовалюта, натхненна історичним європейським Талером. Безпечний, швидкий, децентралізований.'

[params]
  description = 'TALER Blockchain — a modern hybrid PoW/PoS cryptocurrency inspired by the historic European Thaler.'
  primaryColor = '#1B8FBA'
  ogImage = '/images/og-default.png'
  twitterSite = '@TalerBlockchain'
  contactEmail = 'info@taler.tech'
  securityEmail = 'info@taler.tech'

  # Verified project profiles — used for Organization.sameAs in JSON-LD
  # and for the About / Contact page contact card grid.
  [params.social]
    twitter         = 'https://twitter.com/TalerBlockchain'
    telegram        = 'https://t.me/talercommunity'
    github          = 'https://github.com/abkvme/taler'
    codeberg        = 'https://codeberg.org/taler/taler'
    githubLegacy    = 'https://github.com/cryptadev/taler'
    githubExplorer  = 'https://github.com/abkvme/taler-explorer'
    discussions     = 'https://github.com/abkvme/taler/discussions'
    issues          = 'https://github.com/abkvme/taler/issues'
    explorer        = 'https://explorer.taler.tech/'
    explorerAlt     = 'https://explorer.talercoin.org/'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ['HTML', 'RSS']
