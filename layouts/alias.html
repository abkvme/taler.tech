    <script>
        (function() {
            var supported = ['en', 'be', 'ru', 'uk'];
            var saved = null;
            try { saved = localStorage.getItem('talerLang'); } catch (e) {}
            var browser = (navigator.language || 'en').substring(0, 2);
            var target = saved && supported.indexOf(saved) !== -1
                ? saved
                : (supported.indexOf(browser) !== -1 ? browser : 'en');
            window.location.replace('/' + target + '/');
        })();
