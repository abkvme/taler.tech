# /etc/nginx/sites-available/taler.tech
#
# Hardened nginx site configuration for the TALER Blockchain Hugo site.
#
# Drops in over the existing Certbot-managed file. Lines marked
# "# managed by Certbot" are preserved so `certbot renew` keeps working.
#
# Highlights:
#   - HTTP/2 over TCP/443 (mandatory floor, fallback for HTTP/3)
#   - HTTP/3 over QUIC (UDP/443) advertised via Alt-Svc — additive, not a
#     replacement for HTTP/2: clients connect via HTTP/2 first and upgrade.
#   - HSTS, X-Content-Type-Options, X-Frame-Options, Referrer-Policy,
#     Permissions-Policy, COOP, CORP, and a tight Content-Security-Policy
#     self-only — Bootstrap and icons are now hosted from this origin.
#   - Long Cache-Control on static assets, short on HTML
#   - gzip enabled for text resources
#   - Hides nginx version, blocks dotfiles and common scanner paths
#   - HTTP -> HTTPS redirect for any host that lands on :80
#   - Serves /.well-known/security.txt and /llms.txt with correct types
#   - Custom language-aware 404 served from the Hugo build
#
# Requirements:
#   - nginx 1.25.0+ built with --with-http_v3_module for the QUIC lines below.
#     If your nginx does not have QUIC support, comment out the four
#     `listen ... quic` lines, the `http3` / `quic_retry` / `ssl_early_data`
#     directives, and the `add_header Alt-Svc` line — HTTP/2 will keep working.
#   - UDP/443 must be open in the firewall (`ufw allow 443/udp`,
#     `iptables -A INPUT -p udp --dport 443 -j ACCEPT`, etc.)

# ---------- HTTPS server ----------
server {
    server_name taler.tech;

    # HTTP/2 over TCP/443. The standalone `http2` directive replaces the
    # deprecated `listen ... http2` form (nginx >= 1.25.1). The deprecated
    # form also triggers a spurious "protocol options redefined for [::]:443"
    # warning when combined with a QUIC listen on the same address.
    # `# managed by Certbot` markers tell `certbot renew` not to re-add a
    # duplicate `listen 443 ssl;` line.
    listen 443 ssl;       # managed by Certbot
    listen [::]:443 ssl;  # managed by Certbot
    http2 on;

    # HTTP/3 over QUIC/UDP/443 — works on nginx >= 1.25.0 with v3 module.
    # `reuseport` is required so multiple worker processes can share the
    # UDP socket; only set it on one listen line per protocol per address.
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http3            on;
    quic_retry       on;       # mitigates QUIC source-address spoofing / amplification
    ssl_early_data   on;       # 0-RTT resumption — safe here because the site is read-only static HTML

    ssl_certificate     /etc/letsencrypt/live/taler.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/taler.tech/privkey.pem;   # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;        # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;              # managed by Certbot

    # Advertise HTTP/3 to clients so they upgrade on subsequent requests.
    # ma=86400 = cache the advertisement for 24 hours.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # Hugo output
    root  /var/www/taler.tech/public;
    index index.html;

    # Don't leak the nginx version
    server_tokens off;

    # Reasonable size limits for a static site
    client_max_body_size 1m;
    client_body_timeout  10s;
    client_header_timeout 10s;

    # ---------- Compression ----------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/xml
        application/xhtml+xml
        image/svg+xml
        font/ttf
        font/otf;

    # ---------- Security headers (sent on every successful response) ----------
    # 1 year HSTS with preload + subdomains. Submit at hstspreload.org once stable.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin"        always;
    add_header Cross-Origin-Resource-Policy "same-origin"        always;
    add_header X-Robots-Tag              "all"                                          always;

    # Content Security Policy.
    # Self-only: Bootstrap and icon CSS are served from /vendor/ and /css/.
    # 'unsafe-inline' on style-src is required by Bootstrap + the inline language-detect script;
    # tighten further with nonces if you decide to remove inline scripts entirely.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;

    # ---------- Static assets: long cache, immutable ----------
    location ~* \.(?:css|js|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Re-emit the security headers because add_header is overridden by location-level ones
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        try_files $uri =404;
        access_log off;
    }

    # ---------- Images: medium cache ----------
    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        try_files $uri =404;
        access_log off;
    }

    # ---------- Sitemaps and feeds ----------
    location ~* \.(?:xml|rss|atom)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    # ---------- AI/discovery files served as text/plain ----------
    location = /llms.txt        { default_type text/plain; expires 1d; add_header Cache-Control "public, max-age=86400" always; }
    location = /llms-full.txt   { default_type text/plain; expires 1d; add_header Cache-Control "public, max-age=86400" always; }
    location = /humans.txt      { default_type text/plain; expires 7d; add_header Cache-Control "public, max-age=604800" always; }
    location = /robots.txt      { default_type text/plain; expires 1d; add_header Cache-Control "public, max-age=86400" always; access_log off; }
    location = /.well-known/security.txt { default_type text/plain; expires 1d; add_header Cache-Control "public, max-age=86400" always; }
    # Legacy fallback path — RFC 9116 says the canonical location is
    # /.well-known/security.txt, but some scanners and old tools still look
    # for /security.txt at the root. Serve the same file at both URLs.
    location = /security.txt {
        default_type text/plain;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        alias /var/www/taler.tech/public/.well-known/security.txt;
    }

    # ACME challenge (Certbot) — must remain reachable
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    # Block all other dotfiles (.git, .env, .htaccess, .DS_Store, …)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block scanner-favourite paths that don't exist on a Hugo site
    location ~* /(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|admin\.php) {
        return 404;
    }

    # ---------- HTML and everything else: short cache, must revalidate ----------
    location / {
        # Short browser cache + ETag/Last-Modified revalidation
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        # Re-emit security headers at this scope (nginx add_header inheritance
        # is dropped when a location declares any add_header of its own)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
        add_header Alt-Svc                   'h3=":443"; ma=86400' always;

        try_files $uri $uri/ =404;
    }

    # ---------- Custom 404 (Hugo-rendered, language-aware) ----------
    # Hugo with defaultContentLanguageInSubdir = true does NOT emit a root
    # /404.html — only /en/404.html, /be/404.html, /ru/404.html, /uk/404.html.
    #
    # The named location @custom_404 picks the right file based on the URL
    # prefix of the missing page (so /be/whatever -> /be/404.html). The two
    # subtle bits:
    #
    #   - `error_page 404 =404 @custom_404`: the explicit `=404` forces the
    #     response status. Without it, `error_page 404 = @handler` rewrites
    #     to a 200 because the static file serves successfully, producing a
    #     soft-404 (page renders, status is 200 — a serious SEO bug).
    #
    #   - `rewrite ... last` (not `break`): `last` re-evaluates location
    #     matching with the new URI, so the styled 404 file is served by the
    #     regex location below, which adds the security headers and the
    #     no-cache directive. `break` would skip that location.
    #
    # The 404 files themselves are marked `internal`: a direct external
    # request to /en/404.html returns 404 (avoids soft-404 indexing) but the
    # styled page is still served via the error_page chain.
    error_page 404 =404 @custom_404;

    location @custom_404 {
        internal;
        set $errlang "en";
        if ($uri ~ ^/(be|ru|uk)/) {
            set $errlang $1;
        }
        rewrite ^ /$errlang/404.html last;
    }

    location ~ ^/(en|be|ru|uk)/404\.html$ {
        internal;
        # Don't cache error responses — fresh state once the page reappears.
        add_header Cache-Control             "no-cache, no-store, must-revalidate" always;
        # Re-emit security headers on the error response.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
        add_header Alt-Svc                   'h3=":443"; ma=86400' always;
    }
}

# ---------- Plain-HTTP -> HTTPS redirect ----------
server {
    listen      80;
    listen [::]:80;

    server_name taler.tech;

    if ($host = taler.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 404; # managed by Certbot
}
