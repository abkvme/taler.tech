# /etc/nginx/sites-available/taler.tech
#
# Hardened nginx site configuration for the TALER Blockchain Hugo site.
#
# Drops in over the existing Certbot-managed file. Lines marked
# "# managed by Certbot" are preserved so `certbot renew` keeps working.
#
# Highlights:
#   - HTTP/2 enabled
#   - HSTS, X-Content-Type-Options, X-Frame-Options, Referrer-Policy,
#     Permissions-Policy, COOP, CORP, and a tight Content-Security-Policy
#     that allows the CDNs the site already uses (jsdelivr, cdnjs).
#   - Long Cache-Control on static assets, short on HTML
#   - gzip enabled for text resources
#   - Hides nginx version, blocks dotfiles and common scanner paths
#   - HTTP -> HTTPS redirect for any host that lands on :80
#   - Serves /.well-known/security.txt and /llms.txt with correct types
#   - Custom 404 served as the Hugo 404 page if it exists

# ---------- HTTPS server ----------
server {
    server_name taler.tech;

    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate     /etc/letsencrypt/live/taler.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/taler.tech/privkey.pem;   # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;        # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;              # managed by Certbot

    # Hugo output
    root  /var/www/taler.tech/public;
    index index.html;

    # Don't leak the nginx version
    server_tokens off;

    # Reasonable size limits for a static site
    client_max_body_size 1m;
    client_body_timeout  10s;
    client_header_timeout 10s;

    # ---------- Compression ----------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/xml
        application/xhtml+xml
        image/svg+xml
        font/ttf
        font/otf;

    # ---------- Security headers (sent on every successful response) ----------
    # 1 year HSTS with preload + subdomains. Submit at hstspreload.org once stable.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin"        always;
    add_header Cross-Origin-Resource-Policy "same-origin"        always;
    add_header X-Robots-Tag              "all"                                          always;

    # Content Security Policy.
    # Allows: self for own assets, cdn.jsdelivr.net (Bootstrap), cdnjs.cloudflare.com (Font Awesome).
    # 'unsafe-inline' on style-src is required by Bootstrap + the inline language-detect script;
    # tighten further with nonces if you decide to remove inline scripts entirely.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com data:; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;

    # ---------- Static assets: long cache, immutable ----------
    location ~* \.(?:css|js|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Re-emit the security headers because add_header is overridden by location-level ones
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        try_files $uri =404;
        access_log off;
    }

    # ---------- Images: medium cache ----------
    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        try_files $uri =404;
        access_log off;
    }

    # ---------- Sitemaps and feeds ----------
    location ~* \.(?:xml|rss|atom)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    # ---------- AI/discovery files served as text/plain ----------
    location = /llms.txt        { default_type text/plain; expires 1d; add_header Cache-Control "public, max-age=86400" always; }
    location = /llms-full.txt   { default_type text/plain; expires 1d; add_header Cache-Control "public, max-age=86400" always; }
    location = /humans.txt      { default_type text/plain; expires 7d; add_header Cache-Control "public, max-age=604800" always; }
    location = /robots.txt      { default_type text/plain; expires 1d; add_header Cache-Control "public, max-age=86400" always; access_log off; }
    location = /.well-known/security.txt { default_type text/plain; expires 1d; add_header Cache-Control "public, max-age=86400" always; }
    # Legacy fallback path — RFC 9116 says the canonical location is
    # /.well-known/security.txt, but some scanners and old tools still look
    # for /security.txt at the root. Serve the same file at both URLs.
    location = /security.txt {
        default_type text/plain;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        alias /var/www/taler.tech/public/.well-known/security.txt;
    }

    # ACME challenge (Certbot) — must remain reachable
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    # Block all other dotfiles (.git, .env, .htaccess, .DS_Store, …)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block scanner-favourite paths that don't exist on a Hugo site
    location ~* /(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|admin\.php) {
        return 404;
    }

    # ---------- HTML and everything else: short cache, must revalidate ----------
    location / {
        # Short browser cache + ETag/Last-Modified revalidation
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        # Re-emit security headers at this scope
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com data:; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;

        try_files $uri $uri/ =404;
    }

    # ---------- Custom 404 (Hugo-rendered, language-aware) ----------
    # Hugo with defaultContentLanguageInSubdir = true does NOT emit a root
    # /404.html — only /en/404.html, /be/404.html, /ru/404.html, /uk/404.html.
    #
    # The named location @custom_404 picks the right file based on the URL
    # prefix of the missing page (so /be/whatever -> /be/404.html), then
    # rewrites internally to that path. The 404 status from the original
    # request is preserved through the rewrite.
    #
    # The 404 files themselves are marked `internal`: a direct external
    # request to /en/404.html returns 404 (avoids soft-404 indexing) but the
    # styled page is still served via the error_page chain.
    error_page 404 = @custom_404;

    location @custom_404 {
        internal;
        set $errlang "en";
        if ($uri ~ ^/(be|ru|uk)/) {
            set $errlang $1;
        }
        rewrite ^ /$errlang/404.html break;
    }

    location ~ ^/(en|be|ru|uk)/404\.html$ {
        internal;
        # Don't cache error responses — fresh state once the page reappears.
        add_header Cache-Control             "no-cache, no-store, must-revalidate" always;
        # Re-emit security headers on the error response.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com data:; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
    }
}

# ---------- Plain-HTTP -> HTTPS redirect ----------
server {
    listen      80;
    listen [::]:80;

    server_name taler.tech;

    if ($host = taler.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    return 404; # managed by Certbot
}
